name: Teste do Caixa Eletrónico

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Compilar o ficheiro C
      run: gcc Caixa-eletronico.github.txt -o caixa

    - name: Executar o programa automaticamente
      run: |
        echo -e "1\n2\n50\n3\n" | ./caixa
